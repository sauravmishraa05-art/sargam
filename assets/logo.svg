<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Green Gradient -->
    <linearGradient id="sargamBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28cd5e"/>
      <stop offset="50%" stop-color="#199f48"/>
      <stop offset="100%" stop-color="#0e622b"/>
    </linearGradient>

    <!-- Inner Green Element Gradient -->
    <linearGradient id="sargamGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Frame -->
  <rect x="12" y="12" width="488" height="488" rx="110" ry="110" fill="url(#sargamBgGrad)" />

  <!-- Inner Dark Circle -->
  <circle cx="256" cy="256" r="200" fill="#08080a" filter="url(#innerGlow)" />

  <!-- Green Circle Border Ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#sargamGreenGrad)" stroke-width="12" />

  <!-- Musical Note (Top Center) -->
  <g transform="translate(198, 120)">
    <!-- Note Stem & Flag -->
    <path d="M 72 90 C 72 50, 110 30, 115 15 C 117 10, 120 18, 118 28 C 110 60, 72 65, 72 90 Z" fill="url(#sargamGreenGrad)" />
    <path d="M 60 18 L 60 95 C 60 115, 30 115, 30 100 C 30 85, 60 88, 60 95 Z" fill="url(#sargamGreenGrad)" />
    <!-- Note Head Circle -->
    <ellipse cx="42" cy="102" rx="26" ry="20" transform="rotate(-20, 42, 102)" fill="url(#sargamGreenGrad)" />
  </g>

  <!-- Equalizer / Sound Wave Arcs (Middle) -->
  <g fill="none" stroke="url(#sargamGreenGrad)" stroke-linecap="round">
    <!-- Top Arc (Largest) -->
    <path d="M 170 270 Q 256 220 342 270" stroke-width="18" />
    <!-- Middle Arc -->
    <path d="M 185 305 Q 256 265 327 305" stroke-width="18" />
    <!-- Bottom Arc (Smallest) -->
    <path d="M 205 340 Q 256 310 307 340" stroke-width="18" />
  </g>

  <!-- SARGAM Typography Text (Bottom) -->
  <text x="256" y="388"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        font-size="34"
        fill="#FFFFFF"
        letter-spacing="10"
        text-anchor="middle">SARGAM</text>
</svg>